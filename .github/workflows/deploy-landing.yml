name: Deploy Landing

on:
  workflow_dispatch:
  # Fired by the Content CMS webhook (or `gh api repos/<repo>/dispatches -f event_type=content-published`)
  # so new posts reach the sitemap, blog index and llms.txt, which are built at deploy time.
  repository_dispatch:
    types: [content-published]
  # The CMS webhook cannot send a GitHub token, so poll instead: every 30 minutes the
  # `check` job compares published CMS posts with the live blog index and only deploys
  # when a post is missing from it.
  schedule:
    - cron: "11,41 * * * *"

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check for unpublished-to-site posts
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - name: Compare CMS blog slugs with live blog index
        id: diff
        env:
          KEY: ${{ secrets.BETTER_I18N_CONTENT_API_KEY }}
          PROJECT: ${{ secrets.BETTER_I18N_PROJECT }}
        run: |
          set -euo pipefail
          : > cms.txt
          page=1
          while :; do
            res=$(curl -fsS --retry 3 -H "x-api-key: $KEY" \
              "https://content.better-i18n.com/v1/content/$PROJECT/models/blog-posts/entries?language=en&status=published&limit=100&page=$page&fields=title")
            echo "$res" | jq -r '.items[].slug' >> cms.txt
            [ "$(echo "$res" | jq -r '.hasMore')" = "true" ] || break
            page=$((page+1))
            [ "$page" -le 20 ] || break
          done
          sort -u cms.txt -o cms.txt
          echo "CMS published (en): $(wc -l < cms.txt)"
          [ "$(wc -l < cms.txt)" -ge 100 ] || { echo "CMS returned too few posts; not deploying"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # blog-index-en.json is written at deploy time from the same CMS list. (The sitemap is
          # not usable here: off-topic posts are published but deliberately kept out of it.)
          curl -fsS --retry 3 https://better-i18n.com/blog-index-en.json | jq -r '.allPosts[].slug' | sort -u > live.txt
          missing=$(comm -23 cms.txt live.txt | head -20)
          if [ -n "$missing" ]; then
            echo "Missing from live blog index:"; echo "$missing"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    if: always() && (github.event_name != 'schedule' || needs.check.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://better-i18n.com
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - name: Install Dependencies
        # Not --frozen-lockfile: bun 1.3.10 cannot read back a lockfile it wrote for
        # this tree (the Expo/metro hoisting differs each run), so a frozen install
        # fails on main (checked at a175e7b3). ci.yml and publish.yml install the same way.
        run: bun install

      - name: Build Workspace Packages
        run: bun run build

      - name: Build & Deploy
        working-directory: apps/landing
        run: bun run deploy
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_I18N_CONTENT_API_KEY: ${{ secrets.BETTER_I18N_CONTENT_API_KEY }}
          BETTER_I18N_PROJECT: ${{ secrets.BETTER_I18N_PROJECT }}
